[package]
name = "semweft-desktop"
version = "0.1.0-dev"
edition = "2024"
publish = false

# Keep GUI platform dependencies separate from the engine/CLI workspace.
[workspace]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semweft-shared = { path = "../semweft-shared" }
semweft-protocol = { path = "../semweft-protocol" }
interprocess = "2.4.7"
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS otherwise silently selects GPUI's NoopTextSystem, which paints no glyphs.
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
unicode-segmentation = "1.12"
gpui-rsx = { version = "=0.11.0", features = ["tailwind-scale"] }

[profile.dev]
debug = 0

[profile.dev.package.gpui]
opt-level = 2
