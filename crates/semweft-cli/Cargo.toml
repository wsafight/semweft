[package]
name = "semweft-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
go-experimental = ["semweft-query/go-experimental"]
web-experimental = ["semweft-query/web-experimental"]

[[bin]]
name = "semweft"
path = "src/main.rs"

[dependencies]
semweft-query.workspace = true
semweft-protocol.workspace = true
anyhow.workspace = true
ignore.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
semweft-core.workspace = true
semweft-store.workspace = true
semweft-bench.workspace = true
semweft-lang-rust.workspace = true
globset.workspace = true
interprocess.workspace = true
notify.workspace = true
tokio.workspace = true
rmcp.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
protobuf.workspace = true
scip.workspace = true
tiktoken-rs.workspace = true
